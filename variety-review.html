<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>越鯉 品種画像確認</title>
<style>body{margin:24px;background:#092735;color:#fff;font-family:system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}figure{margin:0;background:#197eaa;border:1px solid #649da9;border-radius:12px;overflow:hidden}img{width:100%;height:350px;object-fit:contain;display:block}figcaption{padding:12px;background:#123746}p{line-height:1.7}</style>
<h1>越鯉 品種画像確認</h1><p>2026年9月5日版。修正した13品種の画像です。図鑑の保存データは変更しません。</p><main id="cards"></main>
<script>
const rows=[[3,'白写り','黒と白のみ'],[4,'緋写り','黒と緋のみ'],[13,'孔雀','白金地・緋・松葉模様'],[14,'浅黄','青灰色の網目・側面の緋'],[18,'葡萄衣','体の緋斑に葡萄色の鱗縁'],[21,'銀鱗大正三色','白・緋・墨と銀鱗'],[23,'銀鱗白写り','白・墨と銀鱗'],[26,'銀鱗丹頂','白い体・頭だけの緋と銀鱗'],[27,'銀鱗丹頂大正三色','白い体と墨・頭だけの緋・銀鱗'],[30,'輝黒竜','白金と黒・ドイツ鱗'],[33,'丹頂大正三色','白い体と墨・頭だけの緋'],[35,'丹頂孔雀','白金地と松葉模様・頭だけの緋'],[41,'ドイツ大和錦','白金・緋・墨・ドイツ鱗']];
for(const [id,name,note] of rows){const f=document.createElement('figure');const img=document.createElement('img');img.src=`pond_legend/${String(id).padStart(2,'0')}.png?v=20260905-variety-corrected2`;img.alt=name;const c=document.createElement('figcaption');c.textContent=`No.${id+1} ${name}（${String(id).padStart(2,'0')}） — ${note}`;f.append(img,c);document.querySelector('main').append(f)}
</script></html>
